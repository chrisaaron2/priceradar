name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt/priceradar
    env:
      GCP_PROJECT_ID: ci-project
      GOOGLE_APPLICATION_CREDENTIALS: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dbt-bigquery>=1.10,<2"
      - run: dbt deps
      - run: dbt parse --profiles-dir .
