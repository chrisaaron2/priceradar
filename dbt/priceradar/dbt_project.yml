name: priceradar
version: "1.1.0"
config-version: 2
profile: priceradar

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # An LLM verdict counts as a match only at or above this confidence.
  # Keep in sync with MATCHER_CONFIDENCE_THRESHOLD used by llm/sku_matcher.py.
  match_confidence_threshold: 0.6

models:
  priceradar:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
